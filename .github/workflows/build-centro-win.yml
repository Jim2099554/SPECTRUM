name: Build Centro - Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with: { python-version: '3.11' }
    - uses: actions/setup-node@v3
      with: { node-version: '20' }
    
    - name: Cache
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-centro-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install Deps
      run: |
        python -m pip install --upgrade pip
        python -m pip install wheel setuptools pyinstaller
        python -m pip install -r ./requirements.txt
        python -m spacy download es_core_news_sm

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
        cd ..
        if (Test-Path backend/client) { Remove-Item -Recurse -Force backend/client }
        Copy-Item -Recurse frontend/dist backend/client
      shell: pwsh

    - name: Create required directories
      run: |
        New-Item -ItemType Directory -Force backend/audios
        New-Item -ItemType Directory -Force backend/photos
        New-Item -ItemType Directory -Force backend/transcripts
      shell: pwsh

    - name: Build Executable
      run: python -m PyInstaller sentinela_centro.spec --clean --noconfirm
      shell: pwsh

    - name: Package
      run: |
        $PKG = "SENTINELA-Centro-Windows-v1.0"
        New-Item -ItemType Directory -Path release/$PKG
        Copy-Item -Recurse dist/SENTINELA_Centro/* release/$PKG/
        Copy-Item start_sentinela.bat release/$PKG/ || echo "No bat"
        Compress-Archive -Path release/$PKG -DestinationPath "release/$PKG.zip"
      shell: pwsh

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SENTINELA-Centro-Windows
        path: release/*.zip
