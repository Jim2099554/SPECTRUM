name: Build SENTINELA - All Artifacts

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        target: [Centro, Admin]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools pyinstaller
        pip install -r ./requirements.txt
        python -m spacy download es_core_news_sm
      
    - name: Install Node dependencies
      working-directory: ./frontend
      run: npm install
      
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
      
    - name: Copy Frontend to Backend
      shell: bash
      run: |
        rm -rf backend/client
        cp -r frontend/dist backend/client
      
    - name: Create required directories
      shell: bash
      run: |
        mkdir -p backend/audios
        mkdir -p backend/photos
        mkdir -p backend/transcripts
      
    - name: Build with PyInstaller
      shell: bash
      run: |
        if [ "${{ matrix.target }}" == "Centro" ]; then
          SPEC_FILE="sentinela_centro.spec"
        else
          SPEC_FILE="sentinela_admin.spec"
        fi
        python -m PyInstaller $SPEC_FILE --clean --noconfirm

    - name: Create Release Package
      shell: bash
      run: |
        TARGET="${{ matrix.target }}"
        OS_NAME="${{ matrix.os }}"
        VERSION="v1.0"
        PKG_NAME="SENTINELA-${TARGET}-${OS_NAME}-${VERSION}"
        
        mkdir -p release/$PKG_NAME
        
        if [ "$OS_NAME" == "windows-latest" ]; then
          cp -r dist/SENTINELA_${TARGET}/* release/$PKG_NAME/
          cp start_sentinela.bat release/$PKG_NAME/ || true
        else
          cp -r dist/SENTINELA_${TARGET}/* release/$PKG_NAME/
        fi
        
        cp LICENSE.txt release/$PKG_NAME/ || true
        cp README.md release/$PKG_NAME/ || true
        cp SISTEMA_LICENCIAS.md release/$PKG_NAME/ || true
        
        cd release
        if [ "$OS_NAME" == "windows-latest" ]; then
          7z a "${PKG_NAME}.zip" "${PKG_NAME}"
        else
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}"
        fi
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SENTINELA-${{ matrix.target }}-${{ matrix.os }}
        path: release/*.zip
        retention-days: 30
